; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs

; ensure strict compatibility to avoid wrong deps (e.g. RP2040)
lib_compat_mode = strict

lib_deps = 
	; Async WebServer (maintained fork, supports ESP8266/ESP32)
	esphome/ESPAsyncWebServer-esphome@^2.1.0
	; TCP layer for ESP8266 Async stack
	me-no-dev/ESPAsyncTCP@^1.2.2
	; JSON
	bblanchon/ArduinoJson@^6.18.5
	; ElegantOTA v3
	ayushsharma82/ElegantOTA@^3.1.0

; ignore RP2040 AsyncTCP which breaks ESP8266 builds
lib_ignore = 
	AsyncTCP_RP2040W
	ESPAsyncWebServer
	ESP Async WebServer
	ESPAsyncWebSrv

; force ElegantOTA to use AsyncWebServer backend
build_flags = 
	-DELEGANTOTA_USE_ASYNC_WEBSERVER
