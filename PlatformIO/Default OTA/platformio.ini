; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
;upload_speed = 921600
lib_deps = 
	ESP8266WebServer
	DNSServer

; OTA Upload Konfiguration (erst nach erstem Upload via Serial aktivieren)
; Ersetze die IP-Adresse mit der tatsächlichen IP des ESP8266
;upload_protocol = espota
;upload_port = 192.168.1.100
;upload_flags = --auth=admin

; Für ersten Upload via Serial verwenden:
upload_protocol = esptool
;upload_port = /dev/ttyUSB0
upload_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Neuere Framework Version für bessere LittleFS Unterstützung
;platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.14
lib_deps = 
	DNSServer

; OTA Upload Konfiguration
;upload_protocol = espota
;upload_port = 192.168.1.100
;upload_flags = --auth=admin

upload_protocol = esptool
upload_speed = 921600

; ESP32 spezifische Einstellungen
board_build.partitions = huge_app.csv